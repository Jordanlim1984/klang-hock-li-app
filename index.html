<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klang Hock Li · Tyres & Rims</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#222;background:#f5f5f5}*{box-sizing:border-box}body{margin:0}header{background:#ed7400;color:white;padding:20px 16px}header h1{margin:0;font-size:24px}header small{opacity:.9}nav{display:flex;overflow:auto;background:white;position:sticky;top:0;box-shadow:0 2px 8px #0001}nav button{flex:1;min-width:85px;border:0;background:white;padding:15px 7px;font-weight:650;color:#555}nav button.active{color:#e76d00;border-bottom:3px solid #e76d00}main{max-width:900px;margin:auto;padding:16px}.panel{display:none}.panel.active{display:block}.card{background:white;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0000000a}h2{font-size:20px;margin:5px 0 14px}label{display:block;margin:12px 0 5px;font-size:14px;font-weight:600}input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}button.action,.link{display:inline-block;background:#ed7400;color:white;border:0;border-radius:8px;padding:11px 16px;margin:10px 6px 0 0;text-decoration:none;font-size:15px;cursor:pointer}.secondary{background:#555!important}.danger{background:#a33!important}.item{border-top:1px solid #eee;padding:12px 0}.muted{color:#777;font-size:13px}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.amount{font-weight:700;color:#d76400}.pill{background:#fff1e4;border-radius:20px;padding:4px 9px;font-size:12px}.empty{color:#777;padding:20px 0}footer{text-align:center;padding:20px;color:#888;font-size:12px}
</style></head><body>
<header><h1>🛞 Klang Hock Li</h1><small>Tyre & Wheel Management · 第一版</small></header>
<nav id="tabs"><button class="active" data-tab="search">Search</button><button data-tab="stock">Stock</button><button data-tab="quote">Quote</button><button data-tab="customer">Customer</button><button data-tab="commission">Commission</button></nav>
<main>
<section id="search" class="panel active"><div class="card"><h2>🔎 搜索轮胎与轮毂</h2><input id="searchTerm" placeholder="尺寸、品牌或花纹，例如 235/50R18、PS5"><div id="searchResults"></div></div></section>
<section id="stock" class="panel"><div class="card"><h2>📦 添加轮胎 / 轮毂库存</h2><form id="stockForm"><label>产品照片（可从相簿选择或拍照）</label><input id="productPhoto" type="file" accept="image/*"><label>品牌</label><input name="brand" required placeholder="Michelin / BBS / Enkei"><label>花纹 / 型号</label><input name="model" required placeholder="Pilot Sport 5"><label>尺寸</label><input name="size" required placeholder="235/50R18 / 18x8.5J"><div class="row"><div><label>数量</label><input name="qty" type="number" min="0" required value="4"></div><div><label>售价 RM / 条</label><input name="price" type="number" min="0" step=".01" required></div></div><div class="row"><div><label>成本 RM / 条</label><input name="cost" type="number" min="0" step=".01" required></div><div><label>备注</label><input name="note" placeholder="Runflat / MO / DOT"></div></div><button class="action" type="submit">保存库存</button></form></div><div class="card"><h2>库存列表</h2><div id="stockList"></div></div></section>
<section id="quote" class="panel"><div class="card"><h2>🧾 创建报价</h2><form id="quoteForm"><label>顾客姓名</label><input name="customer" required placeholder="Customer name"><label>车牌号码</label><input name="plate" placeholder="ABC 1234"><label>选择轮胎</label><select name="stockId" id="quoteStock" required></select><div class="row"><div><label>数量</label><input name="qty" type="number" min="1" value="4" required></div><div><label>安装 / 其他收费 RM</label><input name="extra" type="number" min="0" step=".01" value="0"></div></div><label>负责员工</label><input name="staff" value="Jordan Lim" required><button class="action" type="submit">生成报价</button></form><div id="quotePreview"></div></div><div class="card"><h2>历史报价</h2><div id="quoteList"></div></div></section>
<section id="customer" class="panel"><div class="card"><h2>👤 顾客资料</h2><form id="customerForm"><label>姓名</label><input name="name" required><label>电话</label><input name="phone" type="tel" required><label>车牌</label><input name="plate"><label>备注</label><textarea name="note" rows="2"></textarea><button class="action" type="submit">保存顾客</button></form></div><div class="card"><h2>顾客列表</h2><input id="customerSearch" placeholder="搜索姓名、电话或车牌"><div id="customerList"></div></div></section>
<section id="commission" class="panel"><div class="card"><h2>💰 佣金统计</h2><p class="muted">默认按每张报价的估计毛利 × 10% 计算；只有标记“已成交”的报价才计入。</p><label>佣金比例 (%)</label><input id="rate" type="number" min="0" max="100" step=".1" value="10"><div id="commissionList"></div></div></section>
<div class="card"><h2>📲 联系我们</h2><p>Jordan Lim · 019-689 8559</p><a class="link" href="https://wa.me/60196898559" target="_blank" rel="noopener">WhatsApp 联系</a><button class="action secondary" id="export">备份数据 JSON</button><label>导入备份 JSON</label><input id="import" type="file" accept=".json,application/json"><p class="muted">数据暂存于当前浏览器。清除浏览器数据可能导致记录消失；请定期备份。不同手机或电脑不会自动同步。</p></div>
</main><footer>© Klang Hock Li · Prototype v2 · Offline-first</footer>
<script>
const KEY='khl-app-v1';
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!Array.isArray(db.stock))db={stock:[],customers:[],quotes:[],rate:10};
db.customers??=[];db.quotes??=[];db.rate??=10;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'RM '+Number(n||0).toFixed(2),save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()},id=()=>String(Date.now())+Math.random().toString(36).slice(2,6),form=f=>Object.fromEntries(new FormData(f).entries());
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab],.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});
$('#stockForm').onsubmit=async e=>{e.preventDefault();let x=form(e.target);let file=$('#productPhoto').files[0];if(file&&file.size>1500000){alert('照片太大，请选择小于 1.5MB 的图片');return}let photo='';if(file){photo=await new Promise(resolve=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file)})}db.stock.push({...x,id:id(),photo,qty:+x.qty,price:+x.price,cost:+x.cost});e.target.reset();try{save()}catch(err){db.stock.pop();alert('储存空间不足，请使用较小的照片')}};
$('#customerForm').onsubmit=e=>{e.preventDefault();db.customers.push({...form(e.target),id:id()});e.target.reset();save()};
$('#quoteForm').onsubmit=e=>{e.preventDefault();let x=form(e.target),s=db.stock.find(t=>t.id===x.stockId);if(!s)return alert('请先添加库存');if(+x.qty>s.qty&&!confirm('报价数量超过现有库存，仍然继续？'))return;let q={...x,id:id(),qty:+x.qty,extra:+x.extra,unitPrice:s.price,unitCost:s.cost,item:[s.brand,s.model,s.size].join(' '),date:new Date().toLocaleString(),sold:false};db.quotes.unshift(q);save();preview(q);};
function preview(q){let total=q.qty*q.unitPrice+q.extra;$('#quotePreview').innerHTML=`<div class="card"><h2>Quotation</h2><p><b>Klang Hock Li</b></p><p>Customer: ${esc(q.customer)}<br>Plate: ${esc(q.plate)}<br>Date: ${esc(q.date)}</p><p>${esc(q.item)}<br>${q.qty} × ${money(q.unitPrice)}<br>Others: ${money(q.extra)}</p><h2>Total: ${money(total)}</h2><p>Sales: ${esc(q.staff)}</p><p>Jordan Lim · 019-689 8559</p><button class="action" onclick="window.print()">打印 / 保存 PDF</button><a class="link" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Klang Hock Li Quotation\n'+q.item+'\n'+q.qty+' x '+money(q.unitPrice)+'\nOthers: '+money(q.extra)+'\nTotal: '+money(total)+'\nContact: 019-689 8559')}">分享 WhatsApp</a></div>`}
window.removeItem=(type,uid)=>{if(confirm('确定删除？')){db[type]=db[type].filter(x=>x.id!==uid);save()}};
window.markSold=uid=>{let q=db.quotes.find(x=>x.id===uid);if(!q)return;if(!q.sold){let s=db.stock.find(x=>x.id===q.stockId);if(s){if(s.qty<q.qty&&!confirm('库存不足，仍要确认成交并扣库存？'))return;s.qty-=q.qty;}q.sold=true}else{if(!confirm('取消成交状态？库存将恢复（如商品仍存在）。'))return;let s=db.stock.find(x=>x.id===q.stockId);if(s)s.qty+=q.qty;q.sold=false}save()};
function render(){let term=$('#searchTerm').value.toLowerCase(),stocks=db.stock.filter(x=>(x.brand+' '+x.model+' '+x.size+' '+x.note).toLowerCase().includes(term));let card=s=>`<div class="item">${s.photo?`<img src="${s.photo}" alt="产品照片" style="width:110px;height:90px;object-fit:cover;border-radius:8px;float:right">`:``}<b>${esc(s.brand)} ${esc(s.model)}</b><br>${esc(s.size)} <span class="pill">剩余 ${s.qty}</span><br><span class="amount">${money(s.price)} / 条</span><br><span class="muted">${esc(s.note)}</span></div>`;$('#searchResults').innerHTML=stocks.map(card).join('')||'<div class="empty">没有匹配库存</div>';$('#stockList').innerHTML=db.stock.map(s=>card(s)+`<button class="action danger" onclick="removeItem('stock','${s.id}')">删除</button>`).join('')||'<div class="empty">还没有库存，请先添加。</div>';$('#quoteStock').innerHTML=db.stock.map(s=>`<option value="${s.id}">${esc(s.brand+' '+s.model+' '+s.size)} — ${money(s.price)} (${s.qty})</option>`).join('');$('#quoteList').innerHTML=db.quotes.map(q=>`<div class="item"><b>${esc(q.customer)}</b> · ${esc(q.date)}<br>${esc(q.item)} × ${q.qty}<br><b>${money(q.qty*q.unitPrice+q.extra)}</b> · ${esc(q.staff)} · ${q.sold?'已成交':'未成交'}<br><button class="action" onclick="showQuote('${q.id}')">查看</button><button class="action secondary" onclick="markSold('${q.id}')">${q.sold?'取消成交':'标记已成交'}</button><button class="action danger" onclick="removeItem('quotes','${q.id}')">删除</button></div>`).join('')||'<div class="empty">暂无报价</div>';let ct=$('#customerSearch').value.toLowerCase();$('#customerList').innerHTML=db.customers.filter(c=>(c.name+' '+c.phone+' '+c.plate).toLowerCase().includes(ct)).map(c=>`<div class="item"><b>${esc(c.name)}</b><br>${esc(c.phone)} · ${esc(c.plate)}<br><span class="muted">${esc(c.note)}</span><br><button class="action danger" onclick="removeItem('customers','${c.id}')">删除</button></div>`).join('')||'<div class="empty">暂无顾客</div>';$('#rate').value=db.rate;let totals={};db.quotes.filter(q=>q.sold).forEach(q=>{let profit=q.qty*(q.unitPrice-q.unitCost)+q.extra;totals[q.staff]=(totals[q.staff]||0)+profit*db.rate/100});$('#commissionList').innerHTML=Object.entries(totals).map(([name,amt])=>`<div class="item"><b>${esc(name)}</b><br><span class="amount">${money(amt)}</span></div>`).join('')||'<div class="empty">暂无已成交报价</div>'}
window.showQuote=uid=>{let q=db.quotes.find(x=>x.id===uid);if(q){document.querySelector('[data-tab="quote"]').click();preview(q);$('#quotePreview').scrollIntoView({behavior:'smooth'})}};
$('#searchTerm').oninput=render;$('#customerSearch').oninput=render;$('#rate').onchange=e=>{db.rate=+e.target.value;save()};
$('#export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='klang-hock-li-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
$('#import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.stock)||!Array.isArray(data.customers)||!Array.isArray(data.quotes))throw Error('格式不正确');if(confirm('导入将覆盖当前所有数据，确定？')){db=data;save()}}catch(err){alert('导入失败：'+err.message)}e.target.value=''};
render();
</script></body></html>
