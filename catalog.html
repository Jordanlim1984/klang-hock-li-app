<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tyres & Sport Rims Catalogue | Klang Hock Li Tyre</title><meta name="description" content="Browse tyres, sport rims and accessories in Klang, Selangor."><style>body{font:16px system-ui;margin:0;background:#f5f5f5;color:#222}header{background:#e87500;color:white;padding:20px}main{max-width:1000px;margin:auto;padding:16px}a{color:#a54c00}header a{color:white}input{box-sizing:border-box;width:100%;padding:12px;font:inherit}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}article{background:white;padding:12px;border-radius:12px;overflow-wrap:anywhere}img{width:100%;aspect-ratio:1;object-fit:contain}h2{font-size:17px}p{white-space:pre-wrap}button{padding:10px}#grid.single{grid-template-columns:1fr}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body><header><h1>Klang Hock Li Tyre Catalogue</h1><a href="./">Home / Login</a></header><main><p>Tyres, sport rims and accessories in Klang, Selangor.</p><input id="search" placeholder="Search brand, model or size" aria-label="Search products"><p id="status" role="status">Loading products…</p><div id="grid"></div></main><script>const sb=supabase.createClient("https://wkjkiunuiemwbxjtrddq.supabase.co","sb_publishable_fuRkyrKByPZE_YV-A35ipw_hnVMF4ZY",{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'public-catalog-only'}});const grid=document.getElementById('grid'),search=document.getElementById('search'),status=document.getElementById('status');const id=new URLSearchParams(location.search).get('id');let items=[];function render(){grid.replaceChildren();grid.classList.toggle('single',!!id);const q=search.value.toLowerCase();for(const p of items.filter(p=>(!id||p.id===id)&&[p.brand,p.model,p.size].join(' ').toLowerCase().includes(q))){const a=document.createElement('article');if(p.image){const im=document.createElement('img');im.src=p.image;im.alt=[p.brand,p.model,p.size].filter(Boolean).join(' ');im.loading='lazy';a.append(im)}const h=document.createElement('h2'),link=document.createElement('a');link.href='catalog.html?id='+encodeURIComponent(p.id);link.textContent=[p.brand,p.model,p.size].filter(Boolean).join(' ');h.append(link);a.append(h);const price=document.createElement('strong');price.textContent='RM '+Number(p.price).toFixed(2)+(p.category==='rim'?' / set (4 pcs)':'');a.append(price);const d=document.createElement('p');d.textContent=p.description||'';a.append(d);grid.append(a)}status.textContent=grid.children.length?'':'No products found';}search.oninput=render;(async()=>{try{const [a,b]=await Promise.all([sb.rpc('get_public_catalog'),sb.rpc('get_public_product_images')]);if(a.error||b.error)throw Error('Catalogue unavailable');const paths=new Map(b.data.map(p=>[p.product_id,p.image_path]));items=a.data;await Promise.all(items.map(async p=>{if(paths.has(p.id)){const x=await sb.storage.from('product-images').createSignedUrl(paths.get(p.id),3600);if(!x.error)p.image=x.data.signedUrl}}));if(id){search.hidden=true;const p=items.find(p=>p.id===id);if(p)document.title=[p.brand,p.model,p.size,'Klang Hock Li Tyre'].filter(Boolean).join(' ')}render()}catch(e){status.textContent='Unable to load catalogue. Please try again later.'}})();</script></body></html>
